name: Checkpoint 3c92aa34 synchronisieren

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/checkpoint-sync.yml

permissions:
  contents: write

jobs:
  sync-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Geprüften Checkpoint laden und verifizieren
        env:
          ARCHIVE_URL: https://files.manuscdn.com/user_upload_by_module/session_file/310519663350288528/zLwRmLQddZnRTkeD.zip
          ARCHIVE_SHA256: a45a4f7ee53470324b3d99040d8bce78f356e5a182d25af6bb3890e03e606503
        run: |
          curl --fail --location --retry 3 "$ARCHIVE_URL" --output /tmp/seelenplanerin-checkpoint.zip
          echo "$ARCHIVE_SHA256  /tmp/seelenplanerin-checkpoint.zip" | sha256sum --check
          mkdir -p /tmp/seelenplanerin-checkpoint
          unzip -q /tmp/seelenplanerin-checkpoint.zip -d /tmp/seelenplanerin-checkpoint

      - name: Repository exakt synchronisieren
        run: |
          rsync -a --delete --exclude='.git/' /tmp/seelenplanerin-checkpoint/ ./

      - name: Kritische Änderungen prüfen
        run: |
          grep -q 'seelenapp-6tnxx849.manus.space' constants/oauth.ts
          grep -q 'Push-Statistik konnte nicht geladen werden' app/admin.tsx
          grep -q 'dev-static-preview.mjs' package.json

      - name: Checkpoint auf main übernehmen
        run: |
          git config user.name "manus-agent"
          git config user.email "manus-agent@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Der Checkpoint ist bereits vollständig synchronisiert."
          else
            git commit -m "Checkpoint 3c92aa34: Push-Fix und stabiler Entwicklungsserver"
            git push origin HEAD:main
          fi
